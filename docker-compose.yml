version: '3.8'
name: ${CONTAINER_NAME}
services:
  server:
    env_file: .env
    container_name: ${CONTAINER_NAME}-backend
    build: ./
    restart: always
    ports:
      - "${NODE_LOCAL_PORT}:${NODE_DOCKER_PORT}"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_PORT=${DB_PORT}
      - DB_CONNECTION_LIMIT=4
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}
      - DISCORD_KEY=${DISCORD_KEY}
      - DISCORD_BOT_AVATAR=${DISCORD_BOT_AVATAR}
      - DISCORD_BOT_NAME=${DISCORD_BOT_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_DOCKER_PORT}
    networks:
      - bridge
      - database-bridge
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: ${CONTAINER_NAME}-redis
    ports:
      - "${REDIS_LOCAL_PORT}:${REDIS_DOCKER_PORT}"
    networks:
      - bridge

networks:
  database-bridge:
    external: true
  bridge:
